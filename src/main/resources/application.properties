server.port=9001
logging.level.com.kanstantin.camping=TRACE

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/liquibase-changelog.xml

spring.liquibase.dropFirst=false
spring.liquibase.databasechangelogtable=db_liquibase
spring.liquibase.databasechangeloglocktable=db_liquibase_lock

spring.jpa.generate-ddl=false
spring.datasource.url=jdbc:mariadb://localhost/camping_ration
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=camping-ration
spring.datasource.password=sql
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
